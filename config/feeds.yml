# ============================================================================
#  Feeds · 期刊订阅源（纯期刊 RSS，没有关键词检索）
#  ---------------------------------------------------------------------------
#  每天的推送 100% 来自你在这个文件里列出的期刊。
#  加一本刊 = 复制一段，改 id / name / url 三个字段。
#
#  ⚠️ 各出版社的 RSS 路径规则不一样，踩过坑记在这里：
#
#   Wiley      https://onlinelibrary.wiley.com/feed/{ISSN}/most-recent
#              ⚠️ ISSN 必须去掉连字符！14610248 ✅   1461-0248 ❌(404)
#              BES 的刊走 besjournals.onlinelibrary.wiley.com/feed/{ISSN}/most-recent
#              ESA 的刊走 esajournals.onlinelibrary.wiley.com/feed/{ISSN}/most-recent
#              Wiley 的 feed 只有标题+卷期，没有摘要 —— 抓下来后会自动去
#              OpenAlex / Crossref 回填（实测命中率 95%）
#
#   Nature     https://www.nature.com/{刊名缩写}.rss        例：natecolevol.rss
#   Cell Press https://www.cell.com/{刊路径}/inpress.rss    例：trends/ecology-evolution/inpress.rss
#              ⚠️ 用 /rss 会 403，必须用 inpress.rss
#   Springer   https://link.springer.com/search.rss?facet-journal-id={期刊ID}
#              ⚠️ /journal/{id}/rss 已失效。期刊 ID 看文章 URL 里的数字
#   bioRxiv    https://connect.biorxiv.org/biorxiv_xml.php?subject={学科}
#   arXiv      https://rss.arxiv.org/rss/{分类}
#   Pensoft    https://{刊名}.pensoft.net/rss.php
#
#   已确认不可用（别浪费时间）：ScienceDirect(403)、MDPI(403)、
#   Wiley 旧格式 /feed/1461-0248/... (必须无连字符)、Springer /journal/{id}/rss
#
#  所有条目都支持：enabled / lookback_days / max_items / group
#  lookback_days 只影响「多久以前的算新」，RSS 本身只给最近若干篇。
# ============================================================================

defaults:
  enabled: true
  lookback_days: 30
  max_items: 40

